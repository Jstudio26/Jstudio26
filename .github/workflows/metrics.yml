name: Metrics

on:
  schedule: [{cron: "0 0 * * *"}]   # update tiap hari jam 00.00 UTC
  workflow_dispatch:                 # boleh dijalanin manual dari tab Actions
  push: {branches: ["main"]}

jobs:
  github-metrics:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          filename: github-metrics.svg
          template: terminal
          base: header
          plugin_languages: yes
          plugin_languages_limit: 6
          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year
